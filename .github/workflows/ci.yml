name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.32.5"

jobs:
  test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check 500-line file limit
        run: bash tool/check_file_length.sh

  build-apk:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      # google-services.json is gitignored (RULES.md §5.4). The debug build
      # only needs a structurally valid file, so CI uses a placeholder with
      # fake keys; the real config never enters the repo or CI.
      - name: Create placeholder google-services.json
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.hebrewcalendar.hebrew_calendar"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyA-ci-placeholder-key-0000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        run: flutter build apk --debug
