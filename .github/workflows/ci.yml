name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.32.5"

jobs:
  test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check 500-line file limit
        run: bash tool/check_file_length.sh

  build-apk:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_GS_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      # google-services.json is gitignored (RULES.md §5.4). If the repo has
      # the GOOGLE_SERVICES_JSON secret, the APK is built with the real
      # config (installable + Google Sign-In works, thanks to the committed
      # deterministic debug keystore whose SHA-1 is registered in Firebase).
      - name: Write google-services.json from secret
        if: ${{ env.HAS_GS_SECRET == 'true' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # Fallback: a structurally valid placeholder with fake keys, so the
      # build still verifies Gradle wiring on forks/PRs without the secret.
      - name: Create placeholder google-services.json
        if: ${{ env.HAS_GS_SECRET != 'true' }}
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.hebrewcalendar.hebrew_calendar"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyA-ci-placeholder-key-0000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        run: flutter build apk --debug

      # Downloadable from the workflow run page (Actions -> run -> Artifacts)
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-calendar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
