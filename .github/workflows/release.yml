name: Release to Google Play

# - Pushing a tag vX.Y.Z builds a signed AAB and uploads it to the internal track.
# - Manual runs choose the track. Production is only ever released manually,
#   with a staged rollout fraction.
# - track "none" only builds the signed AAB as a workflow artifact (used for the
#   first upload, which Google Play requires to be done by hand).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options: [none, internal, alpha, beta, production]
        default: internal
      rollout:
        description: Production rollout fraction (0-1], e.g. 0.1 for 10%
        type: string
        default: '0.1'
      draft:
        description: Upload as draft (required until the app's first review is approved)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: il.co.natanor.kalfapp.hebrewcalendar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve version and release settings
        id: cfg
        env:
          TRACK: ${{ inputs.track || 'internal' }}
          ROLLOUT: ${{ inputs.rollout || '1' }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          fi
          # Monotonic versionCode, independent of pubspec's build number.
          code=$((100 + GITHUB_RUN_NUMBER))

          if [[ "$DRAFT" == "true" ]]; then
            status=draft; fraction=""
          elif [[ "$TRACK" == "production" ]] && awk "BEGIN{exit !($ROLLOUT < 1)}"; then
            status=inProgress; fraction="$ROLLOUT"
          else
            status=completed; fraction=""
          fi

          {
            echo "name=$name"
            echo "code=$code"
            echo "track=$TRACK"
            echo "status=$status"
            echo "fraction=$fraction"
          } >> "$GITHUB_OUTPUT"
          echo "### $name ($code) → $TRACK [$status${fraction:+ $fraction}]" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - name: Build signed App Bundle
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.cfg.outputs.name }}
          --build-number=${{ steps.cfg.outputs.code }}

      - name: Keep AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.cfg.outputs.name }}-${{ steps.cfg.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: steps.cfg.outputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_KEY }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.cfg.outputs.track }}
          status: ${{ steps.cfg.outputs.status }}
          userFraction: ${{ steps.cfg.outputs.fraction }}
          releaseName: ${{ steps.cfg.outputs.name }} (${{ steps.cfg.outputs.code }})
          whatsNewDirectory: distribution/whatsnew

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
