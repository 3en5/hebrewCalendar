name: Release

# Manual only (docs/RELEASE.md walks through running this): a signed release
# App Bundle should never be produced by a plain push/PR the way the debug
# APK in ci.yml is.
#
# The `track` input picks where the signed AAB goes: `none` only keeps it as a
# workflow artifact (the very first Play upload must be done by hand in Play
# Console); otherwise it is uploaded with the GOOGLE_PLAY_KEY service account.
# Production is released only after explicit owner approval, as a staged
# rollout (`rollout` < 1).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (none = build artifact only)"
        type: choice
        options: [none, internal, alpha, beta, production]
        default: internal
      rollout:
        description: "Production rollout fraction (0-1], e.g. 0.1 = 10%"
        type: string
        default: "0.1"
      draft:
        description: "Upload as draft (required until the app's first review is approved)"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.32.5"

jobs:
  build-release-appbundle:
    name: Build signed release App Bundle
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
      HAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
      HAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' }}
      HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY != '' }}
      APP_ID: il.co.natanor.kalfapp.hebrewcalendar
      TRACK: ${{ inputs.track }}
    steps:
      # The release build (Gradle caches + NDK) can exhaust the runner's
      # disk, as the debug build in ci.yml did; drop unused toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      # A signed release build needs all five secrets (docs/RELEASE.md lists
      # how to generate/register each one) — fail fast with a clear message
      # rather than partway through the build.
      - name: Verify required secrets are configured
        run: |
          missing=""
          [ "$HAS_KEYSTORE_BASE64" = "true" ] || missing="$missing KEYSTORE_BASE64"
          [ "$HAS_KEYSTORE_PASSWORD" = "true" ] || missing="$missing KEYSTORE_PASSWORD"
          [ "$HAS_KEY_ALIAS" = "true" ] || missing="$missing KEY_ALIAS"
          [ "$HAS_KEY_PASSWORD" = "true" ] || missing="$missing KEY_PASSWORD"
          [ "$HAS_GOOGLE_SERVICES_JSON" = "true" ] || missing="$missing GOOGLE_SERVICES_JSON"
          if [ "$TRACK" != "none" ]; then
            [ "$HAS_GOOGLE_PLAY_KEY" = "true" ] || missing="$missing GOOGLE_PLAY_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "Missing required repository secret(s):$missing" >&2
            echo "See docs/RELEASE.md for how to generate and add them." >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      # Prefer the live config from Firebase (always matches the registered
      # signing fingerprints); fall back to the GOOGLE_SERVICES_JSON secret.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY }}
          FIREBASE_PROJECT: hebrewcalendar-68363
          PACKAGE_NAME: ${{ env.APP_ID }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if [ "$HAS_GOOGLE_PLAY_KEY" = "true" ]; then
            pip install --quiet google-auth requests
            python3 tool/fetch_google_services.py android/app/google-services.json \
              || echo "::warning::Could not fetch google-services.json from Firebase; using the secret"
          fi
          # Unlike ci.yml there is no placeholder fallback: a release without
          # the real Firebase config would ship with Google Sign-In broken.
          if ! grep -q "\"$APP_ID\"" android/app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON has no client for $APP_ID" >&2
            exit 1
          fi

      # android/key.properties + the decoded keystore are exactly what
      # android/app/build.gradle.kts's `hasReleaseSigning` check looks for —
      # the same file a developer would create locally per docs/RELEASE.md,
      # just written from secrets instead of by hand.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # versionName comes straight from pubspec.yaml's `version:` (e.g.
      # "1.2.0" out of "1.2.0+1"); versionCode is that same file's build
      # number *offset by this workflow run's number* rather than used
      # as-is, so every release upload gets a strictly-increasing versionCode
      # (Play Console rejects a re-upload otherwise) without hand-editing
      # pubspec.yaml before each run (docs/RELEASE.md).
      - name: Compute version name/code from pubspec.yaml + run number
        id: version
        run: |
          version_line=$(grep '^version:' pubspec.yaml | head -n 1 | sed -E 's/^version:[[:space:]]*//')
          version_name="${version_line%%+*}"
          base_build_number="${version_line##*+}"
          version_code=$((base_build_number + GITHUB_RUN_NUMBER))
          echo "Computed versionName=$version_name versionCode=$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build signed release App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      # Only for `track = none`, where the artifact is the run's whole output
      # (a manual Play upload). Otherwise the Play upload below reads the AAB
      # from disk and Play keeps it, so a copy here only uses Actions storage
      # (the account quota filled up and failed a release, 2026-10-13).
      - name: Upload App Bundle artifact
        if: ${{ inputs.track == 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-calendar-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Resolve Play release status
        id: play
        if: ${{ inputs.track != 'none' }}
        env:
          ROLLOUT: ${{ inputs.rollout }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            status=draft; fraction=""
          elif [ "$TRACK" = "production" ] && awk "BEGIN{exit !($ROLLOUT > 0 && $ROLLOUT < 1)}"; then
            status=inProgress; fraction="$ROLLOUT"
          else
            status=completed; fraction=""
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "fraction=$fraction" >> "$GITHUB_OUTPUT"
          echo "### ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) -> $TRACK [$status${fraction:+ $fraction}]" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Google Play
        if: ${{ inputs.track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_KEY }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ steps.play.outputs.status }}
          userFraction: ${{ steps.play.outputs.fraction }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          whatsNewDirectory: distribution/whatsnew

      # Secrets only ever exist on this ephemeral GitHub-hosted runner, but
      # remove them explicitly anyway rather than relying solely on the
      # runner being torn down.
      - name: Remove decoded secrets from the runner
        if: always()
        run: |
          rm -f android/release.keystore android/key.properties android/app/google-services.json
