name: Website (Firebase Hosting)

# Publishes site/ (homepage, privacy policy, data deletion: needed for the
# Google OAuth verification and the Play listing) to
# https://hebrewcalendar-68363.web.app. Runs when site/ changes on main, or
# manually from any branch. The site holds no user data.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - firebase.json
      - .github/workflows/hosting.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hosting-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY }}
        run: |
          creds="$RUNNER_TEMP/sa.json"
          trap 'rm -f "$creds"' EXIT
          printf '%s' "$GOOGLE_PLAY_KEY" \
            | jq '. + {quota_project_id: "hebrewcalendar-68363"}' > "$creds"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          export GOOGLE_CLOUD_QUOTA_PROJECT=hebrewcalendar-68363
          npx --yes firebase-tools@13 deploy --only hosting \
            --project hebrewcalendar-68363 --non-interactive
