# Strict analyzer + lint configuration. See docs/RULES.md for rationale
# (no hardcoded font sizes, RTL-safety, file-length limits are enforced
# separately by tool/check_file_length.sh).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - "**/node_modules/**"

linter:
  rules:
    always_declare_return_types: true
    prefer_final_locals: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_print: true
    require_trailing_commas: true
